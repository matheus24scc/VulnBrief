[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnbrief"
version = "0.1.0"
description = "Turn security-scan output into a plain-language briefing + remediation checklist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matheus Gabriel Schveitzer" }]

[project.scripts]
vulnbrief = "vulnbrief.cli:main"

[tool.setuptools.packages.find]
include = ["vulnbrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
